name: Dependency review

# Chỉ chạy trên pull request: so sánh dependency của nhánh PR với nhánh đích, chỉ xét phần THAY ĐỔI.
# Chưa chạy thử trên GitHub.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        # actions/dependency-review-action v5.0.0 (MIT), pin theo SHA của tag. Runtime node24: cần runner >= 2.327.1.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Chặn pull request đưa vào lỗ hổng mức high trở lên. Mặc định của action là "low".
          fail-on-severity: high
          # Giấy phép được phép: danh sách trắng. Dependency có giấy phép khác (hoặc không rõ) làm job fail.
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0
