name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

# Không có quyền ghi ở mức workflow.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard (OpenSSF)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write # chỉ job này: upload SARIF lên code scanning (repo public)
      contents: read # checkout
      actions: read # Scorecard đọc trạng thái workflow của repo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false # không đẩy kết quả lên api.scorecard.dev

      - name: Lưu báo cáo SARIF làm artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Đưa kết quả vào tab Security (code scanning)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
