name: Dependency scan

# Hai nhịp: mỗi pull request / push lên main (chặn lỗ hổng do thay đổi mới đưa vào),
# và mỗi sáng thứ Hai (advisory mới công bố cho dependency đã có từ trước).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

# Quyền tối thiểu: chỉ đọc mã nguồn. SARIF được lưu làm artifact, không upload lên code scanning.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scanner:
    name: SCA (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # OSV-Scanner v2.6.0 (Apache-2.0), pin theo digest. Dữ liệu gửi tới OSV.dev: tên gói, phiên bản, hệ sinh thái.
      OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OSV-Scanner quét lockfile (gate)
        # Exit code 1 khi còn lỗ hổng chưa nằm trong osv-scanner.toml -> job fail -> gate chặn.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/src -w /src "$OSV_SCANNER_IMAGE" \
            scan source -r /src --verbosity error

      - name: Xuất SARIF làm bằng chứng
        if: ${{ !cancelled() }}
        # Chạy lại để lấy báo cáo SARIF; exit 1 (có lỗ hổng) là bình thường vì bước gate đã quyết định kết quả.
        run: |
          code=0
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/src -w /src "$OSV_SCANNER_IMAGE" \
            scan source -r /src --verbosity error --format sarif --output-file /src/osv-scanner.sarif || code=$?
          [ "$code" -le 1 ] || exit "$code"

      - name: Lưu báo cáo SARIF làm artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-sarif
          path: osv-scanner.sarif
          if-no-files-found: error
          retention-days: 30
