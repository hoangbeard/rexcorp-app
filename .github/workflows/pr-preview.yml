# CỐ Ý CÓ LỖI. Dùng cho Lab 09a: đọc, quét bằng zizmor và Scorecard, rồi sửa.
# KHÔNG đẩy file này lên nhánh mặc định của repo public và KHÔNG merge nó.
#
# Đây là workflow "xem trước pull request" mà một đồng nghiệp viết vội:
# chạy test trên code của PR rồi báo kết quả. Nó gom bốn lỗi phổ biến vào một file.
name: PR preview

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: write-all

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code của PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ghi chú tiêu đề PR
        run: echo "Đang build preview cho PR '${{ github.event.pull_request.title }}' của ${{ github.actor }}"

      - name: Cài dependency và chạy test
        run: |
          npm ci
          npm test

      - name: Báo kết quả lên PR
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Preview của '${{ github.event.pull_request.title }}' chạy xong."
            });
