name: Requirements check

# Kiểm các requirement trong SECURITY-REQUIREMENTS.md mà máy kiểm được (xem scripts/verify-requirements.sh).
# FAIL làm job đỏ. GAP, SKIP, MANUAL, PARTIAL không làm job đỏ: chúng đã nằm trong backlog (docs/security-backlog.md).
on:
  push:
    branches: [main]
  pull_request:

# Quyền tối thiểu cho GITHUB_TOKEN: chỉ đọc mã nguồn.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-requirements:
    name: Verify security requirements
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag rexcorp-app:req .

      - name: Start application
        run: |
          docker run -d --name rexcorp-req --init --read-only --security-opt no-new-privileges:true \
            -p 127.0.0.1:3300:3000 rexcorp-app:req
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:3300/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "Ứng dụng không khởi động được" >&2
          docker logs rexcorp-req >&2
          exit 1

      - name: Verify requirements
        run: scripts/verify-requirements.sh http://127.0.0.1:3300 rexcorp-app:req

      - name: Stop application
        if: ${{ always() }}
        run: docker rm -f rexcorp-req
