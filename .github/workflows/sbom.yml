name: SBOM

# Mỗi lần merge vào main và mỗi pull request: tạo SBOM của rexcorp-app (CycloneDX và SPDX), kiểm bằng
# checklist SCVS L1, quét rủi ro trên chính SBOM, rồi lưu làm artifact. Chưa chạy thử trên GitHub.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Syft v1.55.0 (Apache-2.0) và OSV-Scanner v2.6.0 (Apache-2.0), pin theo digest.
      SYFT_IMAGE: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
      OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tạo SBOM (CycloneDX và SPDX)
        # Chỉ đưa package npm vào SBOM sản phẩm: loại cataloger "github" (action trong workflow là công cụ build, không phải
        # thành phần giao cho khách). Syft thêm timestamp và mã định danh (serialNumber, documentNamespace).
        run: |
          mkdir -p sbom
          version="$(jq -r .version package.json)"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/src:ro -v "$GITHUB_WORKSPACE/sbom":/out \
            "$SYFT_IMAGE" scan dir:/src --select-catalogers=-github \
            --source-name rexcorp-app --source-version "$version" \
            -o cyclonedx-json=/out/rexcorp-app.cdx.json \
            -o spdx-json=/out/rexcorp-app.spdx.json -q

      - name: Kiểm SCVS L1 (2.1, 2.3, 2.7, 2.9, 2.12, 2.14)
        run: |
          ./scripts/scvs-l1-check.sh sbom/rexcorp-app.cdx.json package-lock.json
          ./scripts/scvs-l1-check.sh sbom/rexcorp-app.spdx.json package-lock.json

      - name: Quét rủi ro trên SBOM (SCVS 2.8)
        # Quét chính file SBOM (tên *.cdx.json được OSV-Scanner nhận ra), không quét lại lockfile.
        # osv-scanner.toml ở gốc repo không tự áp dụng cho thư mục sbom/, nên truyền --config: gate của SBOM
        # dùng đúng cùng ngoại lệ (và cùng hạn) với gate lockfile ở dependency-scan.yml.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/sbom":/sbom:ro \
            -v "$GITHUB_WORKSPACE/osv-scanner.toml":/config/osv-scanner.toml:ro -w /sbom \
            "$OSV_SCANNER_IMAGE" scan source --config /config/osv-scanner.toml -L /sbom/rexcorp-app.cdx.json --verbosity error

      - name: Lưu SBOM làm artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-rexcorp-app
          path: sbom/
          if-no-files-found: error
          retention-days: 90
