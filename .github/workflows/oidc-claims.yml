name: OIDC claims (demo, chỉ in claim, không dùng token)
on:
  push:
    branches: ['wCfix2/**']
permissions: {}
jobs:
  claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Xin OIDC token (audience giả) và in các claim, không in token
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rexcorp-demo" | jq -r .value)
          echo "::add-mask::$TOKEN"
          dec() { local s; s=$(printf '%s' "$1" | tr '_-' '/+'); while [ $(( ${#s} % 4 )) -ne 0 ]; do s="$s="; done; printf '%s' "$s" | base64 -d; }
          echo "--- header"; dec "$(echo "$TOKEN" | cut -d. -f1)" | jq -c '{alg, typ}'
          echo "--- claims"; dec "$(echo "$TOKEN" | cut -d. -f2)" | jq 'del(.jti) | . + {lifetime_seconds: (.exp - .iat)}'
