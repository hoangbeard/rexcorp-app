name: Container and configuration

# Hai job độc lập:
#  - config-scan: Dockerfile (hadolint, Trivy config) và Docker Compose (KICS). Kết quả không đổi theo ngày: chỉ phụ thuộc file trong repo.
#  - image-scan: dựng image rồi quét bằng Trivy. Kết quả ĐỔI THEO NGÀY vì cơ sở dữ liệu lỗ hổng cập nhật liên tục,
#    nên có thêm lần chạy hằng tuần: commit không đổi nhưng CVE mới có thể làm gate đỏ.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1" # thứ Hai hằng tuần, 03:41 UTC
  workflow_dispatch:

# Quyền tối thiểu: chỉ đọc mã nguồn. Báo cáo lưu làm artifact, không upload lên code scanning.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-scan:
    name: Dockerfile and compose (hadolint, Trivy config, KICS)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Mọi công cụ chạy bằng container image pin theo digest. Xem ADR-0006 và Lab 06 về cách xác minh từng digest.
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      # KICS v2.1.20, pin theo digest đã đối chiếu với IoC của Checkmarx (tag này từng bị ghi đè ngày 2026-04-22, nên digest quan trọng hơn tên tag); không dùng tag latest.
      # Image v2.1.21 và v2.2.0 xuất hiện trên Docker Hub tháng 10/2026; Checkmarx chưa nêu bản nào trong hai bản đó là an toàn, nên khóa học giữ digest cũ (Lab 06, Bước 4).
      KICS_IMAGE: checkmarx/kics:v2.1.20@sha256:3e5a268eb8adda2e5a483c9359ddfc4cd520ab856a7076dc0b1d8784a37e2602
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Chuẩn bị thư mục báo cáo và cache (ngoài thư mục được quét)
        run: mkdir -p "$RUNNER_TEMP/container-out" "$RUNNER_TEMP/trivy-cache"

      - name: hadolint, lint mọi Dockerfile (gate từ mức warning, xem .hadolint.yaml)
        run: |
          status=0
          while IFS= read -r dockerfile; do
            echo "== hadolint $dockerfile"
            docker run --rm -v "$GITHUB_WORKSPACE":/src:ro -w /src "$HADOLINT_IMAGE" hadolint "$dockerfile" || status=1
          done < <(git ls-files '*Dockerfile*')
          exit "$status"

      - name: Trivy config, quét Dockerfile (HIGH và CRITICAL chặn)
        if: ${{ !cancelled() }} # chạy cả khi bước trước fail, để một lần chạy cho thấy mọi gate đỏ
        # Trivy config không đọc Docker Compose (xem bài 2); compose do KICS ở bước sau quét.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/cache \
            -v "$RUNNER_TEMP/trivy-cache":/cache -v "$GITHUB_WORKSPACE":/src:ro -w /src "$TRIVY_IMAGE" \
            config --skip-version-check --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile /src/.trivyignore.yaml /src

      - name: KICS, quét Docker Compose (HIGH và CRITICAL chặn)
        if: ${{ !cancelled() }} # chạy cả khi bước trước fail, để một lần chạy cho thấy mọi gate đỏ
        # --network none: quét file cục bộ không cần mạng. --disable-full-descriptions: không gọi kics.io lấy mô tả.
        # Exit code của KICS: 50 khi có HIGH, 60 khi có CRITICAL; MEDIUM trở xuống không làm job fail.
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/src:ro -v "$RUNNER_TEMP/container-out":/out "$KICS_IMAGE" \
            scan -p /src -o /out -t DockerCompose --exclude-paths '/src/.git' \
            --report-formats json,sarif --output-name kics-compose \
            --no-progress --ci --disable-full-descriptions --fail-on critical,high

      - name: Báo cáo SARIF của hadolint và Trivy config (không chặn)
        if: ${{ !cancelled() }} # vẫn chạy khi gate đã fail, để có bằng chứng đầy đủ
        run: |
          files=()
          while IFS= read -r dockerfile; do files+=("$dockerfile"); done < <(git ls-files '*Dockerfile*')
          docker run --rm -v "$GITHUB_WORKSPACE":/src:ro -w /src "$HADOLINT_IMAGE" \
            hadolint --no-fail --format sarif "${files[@]}" > "$RUNNER_TEMP/container-out/hadolint.sarif"
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/cache \
            -v "$RUNNER_TEMP/trivy-cache":/cache -v "$GITHUB_WORKSPACE":/src:ro -v "$RUNNER_TEMP/container-out":/out -w /src "$TRIVY_IMAGE" \
            config --skip-version-check --quiet --format sarif --output /out/trivy-config.sarif /src

      - name: Lưu báo cáo làm artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-scan-reports
          path: ${{ runner.temp }}/container-out/*
          if-no-files-found: error
          retention-days: 30

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Trivy v0.76.1 (Apache-2.0), phát hành 2026-10-21 dưới dạng release immutable; pin theo digest vì sự cố chuỗi cung ứng 03/2026.
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ngày hiện tại (khóa cache)
        id: day
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache cơ sở dữ liệu lỗ hổng của Trivy (theo ngày)
        # Trivy tải ~130 MiB (giải nén ra ~1,5 GiB) mỗi lần chạy nếu thư mục cache trống. Khóa theo ngày: cache cũ vẫn dùng được
        # (restore-keys), Trivy tự tải bản mới khi cơ sở dữ liệu trong cache quá hạn. Cache chỉ chứa cơ sở dữ liệu công khai, không chứa secret.
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.day.outputs.value }}
          restore-keys: trivy-db-

      - name: Dựng image và xuất ra file tar
        # Quét từ file tar nên container Trivy không cần /var/run/docker.sock (quyền root trên host).
        run: |
          mkdir -p "$RUNNER_TEMP/container-out" "$RUNNER_TEMP/trivy-cache"
          docker build --tag rexcorp-app:scan .
          docker save rexcorp-app:scan --output "$RUNNER_TEMP/rexcorp-app.tar"

      - name: Trivy quét image (gate chặn HIGH và CRITICAL đã có bản vá)
        # --ignore-unfixed: chỉ chặn finding mà nhóm làm được gì đó. Finding chưa có bản vá vẫn nằm trong báo cáo JSON.
        # --exit-code 1: có finding (không nằm trong .trivyignore.yaml) thì job fail, gate chặn.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/cache \
            -v "$RUNNER_TEMP/trivy-cache":/cache -v "$RUNNER_TEMP":/work:ro -v "$GITHUB_WORKSPACE":/src:ro "$TRIVY_IMAGE" \
            image --input /work/rexcorp-app.tar --skip-version-check --table-mode detailed \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /src/.trivyignore.yaml

      - name: Báo cáo đầy đủ mọi mức, kể cả chưa có bản vá (không chặn)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/cache \
            -v "$RUNNER_TEMP/trivy-cache":/cache -v "$RUNNER_TEMP":/work -v "$GITHUB_WORKSPACE":/src:ro "$TRIVY_IMAGE" \
            image --input /work/rexcorp-app.tar --skip-version-check --quiet \
            --format json --output /work/container-out/trivy-image-all.json
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/cache \
            -v "$RUNNER_TEMP/trivy-cache":/cache -v "$RUNNER_TEMP":/work -v "$GITHUB_WORKSPACE":/src:ro "$TRIVY_IMAGE" \
            image --input /work/rexcorp-app.tar --skip-version-check --quiet \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore.yaml \
            --format sarif --output /work/container-out/trivy-image-gate.sarif

      - name: Lưu báo cáo làm artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-reports
          path: ${{ runner.temp }}/container-out/*
          if-no-files-found: error
          retention-days: 30
